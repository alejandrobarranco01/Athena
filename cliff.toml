[changelog]
header = "# Changelog\n"
body = """
{% if version %}\
## {{ version | trim_start_matches(pat="v") }} - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }} ({{ commit.id | truncate(length=7, end="") }})\
{% endfor %}
{% endfor %}\n
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true   # commits without a prefix are ignored
tag_pattern = "v[0-9].*"
commit_parsers = [
  { message = "^chore: update changelog", skip = true },
  { message = "^feat",     group = "<!-- 0 -->Features" },
  { message = "^fix",      group = "<!-- 1 -->Bug fixes" },
  { message = "^perf",     group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Refactor" },
  { message = "^docs",     group = "<!-- 4 -->Docs" },
  { message = "^test",     group = "<!-- 5 -->Tests" },
  { message = "^build",    group = "<!-- 6 -->Build" },
  { message = "^ci",       group = "<!-- 7 -->CI" },
  { message = "^chore",    group = "<!-- 8 -->Chores" },
  { message = "^revert",   group = "<!-- 9 -->Reverts" },
]
